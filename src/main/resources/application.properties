entropydata.client.host=https://api.entropy-data.com
entropydata.client.apikey=your-api-key

entropydata.client.snowflake.account=<ORGANIZATION-ACCOUNT>
entropydata.client.snowflake.user=ENTROPYDATA_CONNECTOR
entropydata.client.snowflake.privatekeyfile=file:/rsa_key.p8

entropydata.client.snowflake.assets.enabled=true
entropydata.client.snowflake.assets.connectorid=snowflake-assets
entropydata.client.snowflake.assets.pollinterval=PT10M

entropydata.client.snowflake.accessmanagement.enabled=true
entropydata.client.snowflake.accessmanagement.connectorid=snowflake-access-management

# The synchronization health is reported as a component of the health endpoint, which is only rendered with details enabled
management.endpoint.health.show-details=always
# DEGRADED ranks above UP, so that it shows in the aggregated status. It is not mapped to an error response, because
# restarting the container does not fix an unavailable data platform.
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
